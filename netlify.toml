[build]
  publish = "."
  # No compila nada: compara el bloque de seguridad y los pasos del encendido entre
  # /iniciador-premium/ y /set-parrillero-premium/. Si difieren, el deploy falla.
  command = "bash scripts/check-seguridad.sh"

# --- Redirects: seguro contra un QR mal escrito ---
#
# ⚠️ NO agregar una regla de /iniciador-premium a /iniciador-premium/.
# Netlify ya normaliza la barra final por su cuenta, y ademas matchea las dos
# formas como la misma ruta: con force = true la regla se redirige a si misma
# y deja la URL del QR en un loop infinito (ERR_TOO_MANY_REDIRECTS).
#
# Tampoco usar force = true aca: en /iniciador no hay ningun archivo, asi que
# la regla se aplica igual, y sin force no puede pisar una pagina real.

[[redirects]]
  from = "/iniciador"
  to = "/iniciador-premium/"
  status = 301

# Set Parrillero. Igual que arriba: NO agregar /set-parrillero-premium ->
# /set-parrillero-premium/ (es la URL del QR y entraria en el mismo loop).
# Netlify ya sirve la pagina con y sin barra final.

[[redirects]]
  from = "/set"
  to = "/set-parrillero-premium/"
  status = 301

[[redirects]]
  from = "/set-parrillero"
  to = "/set-parrillero-premium/"
  status = 301

[[redirects]]
  from = "/setparrillero"
  to = "/set-parrillero-premium/"
  status = 301

# --- Cabeceras de seguridad para todo el sitio ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# --- Cache ---
# Los assets llevan version en el nombre (…-v1.mp4), asi que se cachean para siempre.
# Al subir un -v2 el navegador lo pide como archivo nuevo y no sirve el viejo.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML nunca se cachea: un cambio de texto tiene que verse al instante.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/iniciador-premium/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/set-parrillero-premium/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
